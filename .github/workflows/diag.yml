name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Which Meta models can this key use?
        env:
          KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          echo "== GET /v1/models"
          curl -sS https://api.meta.ai/v1/models -H "Authorization: Bearer $KEY" | head -c 3000; echo
          for m in muse-spark-1.3 muse-spark-1.2 muse-spark-1.2-contributor muse-spark-1.3-contributor muse-spark-1.1; do
            code=$(curl -sS -o /tmp/r.json -w "%{http_code}" https://api.meta.ai/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply: ok\"}],\"max_tokens\":8}")
            echo "$m -> $code $(head -c 200 /tmp/r.json)"
          done
