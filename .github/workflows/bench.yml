name: bench
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Model route (meta | gemini | gemini-flash | openrouter)"
        default: meta
      iterations:
        description: "Learning iterations"
        default: "3"
      samples:
        description: "Reviews per PR (stability)"
        default: "1"

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Learning-loop benchmark
        env:
          GATE_PROVIDER: ${{ inputs.provider || 'meta' }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUBQ_API_KEY: ${{ secrets.SUBQ_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run bench -- --reset --iterations ${{ inputs.iterations || '3' }} --samples ${{ inputs.samples || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: .mergegate/results.json }
      - name: Publish results to the results branch
        if: always()
        run: |
          [ -f .mergegate/results.json ] || exit 0
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          cp .mergegate/results.json /tmp/out.json
          git config user.name "mergegate-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin results 2>/dev/null && git checkout -q results 2>/dev/null || git checkout -q --orphan results
          git rm -rqf . 2>/dev/null || true
          git checkout -q origin/results -- runs 2>/dev/null || true
          mkdir -p runs && cp /tmp/out.json runs/$ts-results-${{ github.run_id }}.json
          git add runs && git commit -qm "results run ${{ github.run_id }}" && git push -q origin HEAD:results
